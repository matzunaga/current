<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10100f" />
  <meta
    name="description"
    id="pageDescription"
    content="Current — a living field shaped by the wind in San Diego."
  />
  <title>Current — San Diego</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <main class="experience" aria-labelledby="title">
    <canvas id="field" aria-hidden="true"></canvas>

    <header class="masthead">
      <p class="mark" aria-hidden="true">流</p>
      <h1 id="title">Current</h1>
    </header>

    <!-- Top-right: selected location + weather details -->
    <div class="meta" id="meta">
      <p class="place" id="place">San Diego, California</p>
      <p class="details" id="details" hidden>—</p>
    </div>

    <!-- Bottom: large copy (intro) -->
    <section class="intro" id="intro" aria-live="polite">
      <p class="instruction">The air is moving.<br />Stay with it for a while.</p>
      <p class="hint">Press space or tap Begin.</p>
    </section>

    <!-- Bottom: large copy (running) -->
    <section class="reading" id="reading" aria-live="polite" hidden>
      <p class="condition" id="condition">Listening for the wind.</p>
    </section>

    <div class="controls" id="controls">
      <button class="ctrl ctrl-start" id="start" type="button">Begin</button>
      <span class="ctrl-divider" aria-hidden="true"></span>

      <button
        class="ctrl ctrl-location"
        id="locationButton"
        type="button"
        aria-expanded="false"
        aria-controls="locationPanel"
      >
        Place: San Diego
      </button>

      <button
        class="ctrl ctrl-tone"
        id="toneToggle"
        type="button"
        aria-pressed="false"
      >
        Ocean Tone: Off
      </button>

      <button class="ctrl ctrl-pause" id="pauseBtn" type="button" hidden>
        Pause
      </button>

      <button
        class="ctrl ctrl-info"
        id="aboutButton"
        type="button"
        aria-expanded="false"
        aria-controls="aboutPanel"
      >
        i
      </button>
    </div>

    <p class="status" id="status" role="status">Loading present conditions.</p>

    <!-- Curated city picker -->
    <aside
      class="location-panel"
      id="locationPanel"
      aria-label="Choose a city"
      hidden
    >
      <button
        class="close-location"
        id="closeLocation"
        type="button"
        aria-label="Close city selection"
      >
        ×
      </button>

      <div class="location-picker-layout">
        <div class="location-picker-heading">
          <p class="panel-label">Choose a current</p>
        </div>

        <div class="city-list" id="cityList">
          <button
            class="city-option"
            type="button"
            data-city="san-diego"
            aria-pressed="true"
          >
            San Diego, California
          </button>

          <button
            class="city-option"
            type="button"
            data-city="los-angeles"
            aria-pressed="false"
          >
            Los Angeles, California
          </button>

          <button
            class="city-option"
            type="button"
            data-city="san-francisco"
            aria-pressed="false"
          >
            San Francisco, California
          </button>

          <button
            class="city-option"
            type="button"
            data-city="new-york"
            aria-pressed="false"
          >
            New York, New York
          </button>

          <button
            class="city-option"
            type="button"
            data-city="mexico-city"
            aria-pressed="false"
          >
            Mexico City, Mexico
          </button>

          <button
            class="city-option"
            type="button"
            data-city="london"
            aria-pressed="false"
          >
            London, United Kingdom
          </button>

          <button
            class="city-option"
            type="button"
            data-city="tokyo"
            aria-pressed="false"
          >
            Tokyo, Japan
          </button>
        </div>
      </div>
    </aside>

    <aside class="about-panel" id="aboutPanel" hidden>
      <button
        class="close-about"
