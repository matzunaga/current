name: USGS probe (temporary)
on:
  push:
    branches: [claude/rio-audio-visual-gqwabr]
    paths: [.github/workflows/usgs-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest reading, with Origin header
        run: |
          U="https://api.waterdata.usgs.gov/ogcapi/v1/collections/latest-continuous/items?monitoring_location_id=USGS-09380000&parameter_code=00060&f=json"
          curl -sS -D headers.txt -o latest.json -H "Origin: https://matzunaga.github.io" "$U"
          echo "=== HEADERS ==="; cat headers.txt
          echo "=== BODY ==="; head -c 4000 latest.json; echo
      - name: Preflight
        run: |
          curl -sS -D - -o /dev/null -X OPTIONS \
            -H "Origin: https://matzunaga.github.io" \
            -H "Access-Control-Request-Method: GET" \
            "https://api.waterdata.usgs.gov/ogcapi/v1/collections/latest-continuous/items?f=json"
      - name: Seven days
        run: |
          U="https://api.waterdata.usgs.gov/ogcapi/v1/collections/continuous/items?monitoring_location_id=USGS-09380000&parameter_code=00060&time=P7D&f=json&limit=10000"
          curl -sS -D h7.txt -o week.json -H "Origin: https://matzunaga.github.io" "$U"
          echo "=== HEADERS ==="; cat h7.txt
          python3 - <<'PY'
          import json
          d = json.load(open("week.json"))
          f = d.get("features", [])
          print("keys:", list(d.keys()))
          print("numberReturned:", d.get("numberReturned"), "features:", len(f))
          if f:
              print("first:", json.dumps(f[0]["properties"]))
              print("last:", json.dumps(f[-1]["properties"]))
              v = [float(x["properties"]["value"]) for x in f if x["properties"].get("value") not in (None, "")]
              print("min:", min(v), "max:", max(v))
          print("links:", json.dumps(d.get("links", []))[:1500])
          PY
