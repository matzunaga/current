name: Río live check (temporary)
on:
  push:
    branches: [claude/rio-audio-visual-gqwabr]
    paths: [.github/workflows/rio-live-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Files are served
        run: |
          for f in "" style.css?v=1 app.js?v=1 stream.mp3?v=1; do
            curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download} bytes  /rio/$f\n" "https://matzunaga.github.io/rio/$f"
          done
      - name: A real browser opens the live page
        run: |
          npm i --silent playwright@1.56.1 >/dev/null
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ channel: 'chrome', args: ['--autoplay-policy=no-user-gesture-required'] });
            const p = await b.newPage({ viewport: { width: 390, height: 844 } });
            const errs = [];
            p.on('pageerror', e => errs.push(e.message));
            p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
            p.on('requestfinished', async r => { if (r.url().includes('waterdata')) { const res = await r.response(); console.log('USGS', res.status(), (await res.body()).length, 'bytes'); } });
            p.on('requestfailed', r => console.log('FAILED', r.url(), r.failure().errorText));
            await p.addInitScript(() => {
              window.__starts = 0;
              const AC = window.AudioContext;
              window.AudioContext = function (...a) { const c = new AC(...a); window.__ctx = c; return c; };
              const st = AudioBufferSourceNode.prototype.start;
              AudioBufferSourceNode.prototype.start = function () { window.__starts++; return st.apply(this, arguments); };
            });
            await p.goto('https://matzunaga.github.io/rio/', { waitUntil: 'load' });
            console.log('title', await p.title());
            await p.click('#begin');
            await p.waitForTimeout(15000);
            const r = await p.evaluate(() => ({
              footer: document.getElementById('status').innerText.replace(/\n/g, ' / '),
              audio: window.__ctx && window.__ctx.state,
              passes: window.__starts,
              uiHidden: getComputedStyle(document.querySelector('.intro')).visibility
            }));
            console.log(JSON.stringify(r));
            console.log('errors', JSON.stringify(errs));
            await p.screenshot({ path: 'live.png' });
            await b.close();
          })();
          JS
          node check.js
      - uses: actions/upload-artifact@v4
        with:
          name: live-screenshot
          path: live.png
