name: Río live check (temporary)
on:
  push:
    branches: [claude/rio-audio-visual-gqwabr]
    paths: [.github/workflows/rio-live-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 60
      - name: A real browser opens the live page
        run: |
          npm i --silent playwright@1.56.1 >/dev/null
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ channel: 'chrome', args: ['--autoplay-policy=no-user-gesture-required'] });
            const p = await b.newPage({ viewport: { width: 390, height: 844 } });
            const errs = [];
            p.on('pageerror', e => errs.push(e.message));
            p.on('response', r => { if (r.status() >= 400) errs.push(r.status() + ' ' + r.url()); });
            await p.addInitScript(() => { const AC = window.AudioContext; window.AudioContext = function (...a) { const c = new AC(...a); window.__ctx = c; return c; }; });
            await p.goto('https://matzunaga.github.io/rio/', { waitUntil: 'load' });
            const css = await p.$eval('link[rel=stylesheet]', l => l.getAttribute('href'));
            await p.click('#begin');
            await p.waitForTimeout(12000);
            await p.mouse.click(200, 300);
            await p.waitForTimeout(2200);
            await p.click('#infoButton');
            await p.waitForTimeout(800);
            const r = await p.evaluate(() => ({
              reading: document.getElementById('reading').textContent,
              controls: getComputedStyle(document.getElementById('controls')).visibility,
              audio: window.__ctx && window.__ctx.state,
              footerGone: !document.getElementById('status')
            }));
            console.log('stylesheet', css);
            console.log(JSON.stringify(r));
            console.log('errors', JSON.stringify(errs));
            await b.close();
          })();
          JS
          node check.js
