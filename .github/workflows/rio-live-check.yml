name: Río live check (temporary)
on:
  push:
    branches: [claude/rio-audio-visual-gqwabr]
    paths: [.github/workflows/rio-live-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 75
      - name: A real browser opens the live page
        run: |
          npm i --silent playwright@1.56.1 >/dev/null
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ channel: 'chrome', args: ['--autoplay-policy=no-user-gesture-required'] });
            const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
            const p = await ctx.newPage();
            const errs = [];
            p.on('pageerror', e => errs.push(e.message));
            p.on('response', r => { if (r.status() >= 400) errs.push(r.status() + ' ' + r.url()); });
            await p.addInitScript(() => { const AC = window.AudioContext; window.AudioContext = function (...a) { const c = new AC(...a); window.__ctx = c; return c; }; });
            await p.goto('https://matzunaga.github.io/rio/', { waitUntil: 'load' });
            await p.waitForTimeout(1500);
            const shown = () => p.evaluate(() => { const c = document.getElementById('markCard'); return !c.hidden && getComputedStyle(c).visibility === 'visible'; });
            const r0 = await p.evaluate(() => ({ script: document.querySelector('script[src]').getAttribute('src'), glyph: !!document.querySelector('#mark svg'), kanji: document.body.innerHTML.includes('川') }));
            await p.tap('#mark'); await p.waitForTimeout(300); const open = await shown();
            const card = await p.$eval('#markCard', e => e.innerText.replace(/\n+/g, ' / '));
            await p.tap('#mark'); await p.waitForTimeout(300); const closed = !(await shown());
            await p.tap('#begin'); await p.waitForTimeout(12000);
            await p.touchscreen.tap(200, 400); await p.waitForTimeout(2200);
            await p.tap('#infoButton'); await p.waitForTimeout(800);
            const r = await p.evaluate(() => ({ reading: document.getElementById('reading').textContent, audio: window.__ctx && window.__ctx.state }));
            console.log(JSON.stringify(r0)); console.log('card opens:', open, '| closes:', closed, '|', card);
            console.log(JSON.stringify(r)); console.log('errors', JSON.stringify(errs));
            await b.close();
          })();
          JS
          node check.js
